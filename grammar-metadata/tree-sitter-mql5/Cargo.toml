[package]
name = "tree-sitter-mql5"
version = "0.0.1"
edition = "2024"
license = "ISC"
links = "entanglement_mql5"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cargo_metadata = "0.23"
cc = "1.2"
serde_json = "1"
tree-sitter-generate = { version = "=0.27.1", default-features = false, features = ["load"] }
upstream = { package = "tree-sitter-mql5", git = "https://github.com/davalillo/tree-sitter-mql5.git", rev = "dfbd597792789c5e5083078e5dda77c26b7ecd67" }
